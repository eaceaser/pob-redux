# Ancestral Call boosting slam damage. Move forward once upstream merges the fix
# (local branch fix/ancestral-boost-pass-output in the checkout).
commit = "1bcdb485c5afd74c7b0767cb4f661663d4b548f8"

[poe1]
source_path = "../PathOfBuilding"
commit = "16de4b82d57f1c0de6eb40f37143c32d4da36a02"
