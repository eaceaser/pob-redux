name: build

# Tags are handled by release.yml, which also signs and publishes. Building them
# here too would compile the whole tree (LuaJIT included) a second time for no
# extra coverage.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-22.04
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned PoB commit
        id: pin
        shell: bash
        run: echo "commit=$(grep '^commit' pob-sync.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      # ~84 MB of vendored Lua and decoded tree atlases. The output is a pure
      # function of the pinned upstream commit and pob-sync itself, so a hit
      # skips both the upstream clone and the DDS -> WebP decode.
      - name: Cache vendored Path of Building
        id: pob
        uses: actions/cache@v4
        with:
          path: src-tauri/resources/pob
          key: pob-${{ runner.os }}-${{ steps.pin.outputs.commit }}-${{ hashFiles('crates/pob-sync/**/*.rs', 'crates/pob-sync/Cargo.toml', 'pob-sync.toml') }}

      - name: Checkout PathOfBuilding-PoE2
        if: steps.pob.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: PathOfBuildingCommunity/PathOfBuilding-PoE2
          ref: ${{ steps.pin.outputs.commit }}
          path: upstream/PathOfBuilding-PoE2

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # setup-bun caches the bun binary, not downloaded packages.
      - name: Cache bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          # Shared with release.yml so a tag build starts warm instead of
          # rebuilding LuaJIT from scratch under its own job-scoped key.
          shared-key: pob-redux
          cache-on-failure: true
          # Pull requests restore the cache but must not overwrite main's.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - run: bun install --frozen-lockfile

      - name: Vendor Path of Building
        if: steps.pob.outputs.cache-hit != 'true'
        run: cargo run -p pob-sync -- --source upstream/PathOfBuilding-PoE2 --tree-assets

      # createUpdaterArtifacts is on in tauri.conf.json, so a build signs the
      # bundles and fails without the private key. This workflow has no key and
      # must not: it runs on pull requests, and forks cannot read secrets.
      # release.yml owns signed artifacts; here we only prove the app bundles.
      - name: Build installers
        shell: bash
        run: bun run tauri build --bundles ${{ matrix.bundles }} --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - uses: actions/upload-artifact@v4
        with:
          name: pob-redux-${{ runner.os }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
