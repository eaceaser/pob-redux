name: winget

# Opens a pull request at microsoft/winget-pkgs for a published release, through
# winget-releaser (Komac). It runs on publish rather than on the tag: release.yml
# creates a draft, and the installer URL only resolves once the release is
# public. WINGET_TOKEN is a classic token with the public_repo scope, owned by
# the account that has the winget-pkgs fork. The action only adds versions to a
# package that winget-pkgs already has.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Published release tag to submit, e.g. v0.2.21"
        required: true

permissions:
  contents: read

concurrency:
  group: winget
  cancel-in-progress: false

jobs:
  winget:
    runs-on: windows-latest
    steps:
      - uses: vedantmgoyal9/winget-releaser@b3a5dae0047c6180023acba3f548c55fdf6b7193 # main, 2026-07-28
        with:
          identifier: juddisjudd.PoBRedux
          installers-regex: '_x64-setup\.exe$'
          release-tag: ${{ inputs.tag || github.event.release.tag_name }}
          token: ${{ secrets.WINGET_TOKEN }}
